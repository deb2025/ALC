<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Event Registration Confirmed</title>
</head>
<body style="font-family: Arial, sans-serif; color: #222; line-height: 1.5;">
<p>Dear <strong th:text="${name}">Participant</strong>,</p>

<p>Thank you for registering for <strong th:text="${eventName}">Upcoming Event</strong>.</p>
<p>
    Event Date: <strong th:text="${eventDate}">20 Feb 2026</strong><br/>
    Start Time: <strong th:text="${eventStartTime}">07:30 PM</strong>
</p>

<p th:text="${eventOverview}">Event overview</p>

<div th:if="${eventImage != null}">
    <img th:src="${eventImage}" alt="Event Image" style="max-width: 500px; width: 100%; border-radius: 6px;"/>
</div>

<p>We look forward to your participation.</p>
<p>Team Art Law Communion</p>
<p><strong>Find us here: <a href="https://www.artlawcommunion.com">www.artlawcommunion.com</a> and join us on <a href="https://www.whatsapp.com/">WhatsApp</a>.</strong></p>
</body>
</html>
