spring.application.name=ALC Art Law Communion
server.port=${PORT:8055}
# MongoDB Atlas
# MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb+srv://root:root@alcartlawcommunion.5vg7jeo.mongodb.net/alc?retryWrites=true&w=majority&ssl=true}
spring.data.mongodb.database=${MONGODB_DATABASE:alc}

# Multipart File Upload & Request Limits
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-http-form-post-size=50MB

# Actuator settings
management.endpoint.health.show-details=never
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.mongo.enabled=true

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:alc_cloud}
cloudinary.api-key=${CLOUDINARY_API_KEY:123456789}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:secret}

# Thymeleaf Configuration (for email templates)
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# Brevo
brevo.api.key=${BREVO_API_KEY:brevo_demo_key}

app.admin.email=artlawcommunion@gmail.com
brevo.sender.email=artlawcommunion@gmail.com
brevo.sender.name=Art Law Communion

server.servlet.session.tracking-modes=COOKIE
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true

server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-binding-errors=never

# Production-safe logging defaults
logging.level.org.springframework.security=INFO
logging.level.com.yourorg.email=INFO
logging.level.brevo=INFO
logging.level.okhttp3=INFO

# JWT
jwt.secret=${JWT_SECRET:ArtLawCommunionSuperSecretKeyForJWTAuth2026SecureKeyWith256Bits}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}
jwt.issuer=${JWT_ISSUER:alc-api}

# Security configuration
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
app.security.rate-limit.max-requests-per-minute=${RATE_LIMIT_MAX_REQUESTS_PER_MINUTE:30}

# Google Sheets Configuration
google.sheets.id=${GOOGLE_SHEETS_ID:12345}
google.sheets.range=${GOOGLE_SHEETS_RANGE:Sheet1!A1}
google.credentials=${GOOGLE_CREDENTIALS_FILE:credentials.json}

# API/request logging
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.pattern=%h %l %u %t "%r" %s %b %D
server.tomcat.accesslog.directory=logs
server.tomcat.accesslog.prefix=access
server.tomcat.accesslog.suffix=.log
server.tomcat.basedir=.
spring.mvc.log-request-details=true
logging.level.com.alcw=DEBUG
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG

